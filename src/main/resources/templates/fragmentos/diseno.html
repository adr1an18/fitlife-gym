<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>document.documentElement.setAttribute('data-bs-theme', 'dark');</script>
    <title th:text="${titulo} + ' | FitLife GYM'">FitLife GYM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">FitLife GYM</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/catalogo}">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/nosotros}">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/matriculas}">Matrículas</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Gráficas</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/graficas/planes}">Planes</a></li>
                        <li><a class="dropdown-item" th:href="@{/graficas/matriculas}">Matrículas</a></li>
                    </ul>
                </li>
                <li class="nav-item ms-lg-3">
                    <a class="btn btn-danger" th:href="@{/matriculas}">Matricúlate</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="pie" class="bg-dark text-light py-4 mt-5">
    <div class="container">
        <div class="row text-center">
            <div class="col-md-4 mb-2">Av. Circunvalación 1757, San Luis 15022</div>
            <div class="col-md-4 mb-2">+51 901 343 899</div>
            <div class="col-md-4 mb-2">miuragym@hotmail.com</div>
        </div>
        <p class="text-center mb-0 mt-3">© 2026 FitLife GYM - Todos los derechos reservados</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>

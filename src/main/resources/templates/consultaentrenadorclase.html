<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/diseno :: cabecera('Consulta Entrenador y Clase')}"></head>
<body>

<nav th:replace="~{fragmentos/diseno :: menu}"></nav>

<section class="container my-5">
    <h1 class="fw-bold text-center">Consulta por entrenador y clase</h1>
    <p class="lead text-center">
        Elige un entrenador y luego una de sus clases.
    </p>
</section>

<!-- Listas desplegables en cascada -->
<section class="container my-5">
    <form th:action="@{/consultas/entrenador-clase}"
          method="get"
          class="border rounded p-4">

        <div class="row g-3">
            <div class="col-md-6">
                <label for="idEntrenador" class="form-label">
                    Entrenador
                </label>

                <select id="idEntrenador"
                        name="idEntrenador"
                        class="form-select"
                        onchange="this.form.elements['idClase'].value=''; this.form.submit()">

                    <option value="">Selecciona un entrenador</option>

                    <option th:each="e : ${entrenadores}"
                            th:value="${e.id}"
                            th:text="${e.nombres}"
                            th:selected="${e.id == idEntrenador}">
                    </option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="idClase" class="form-label">Clase</label>

                <select id="idClase"
                        name="idClase"
                        class="form-select"
                        onchange="this.form.submit()"
                        th:disabled="${clases == null or #lists.isEmpty(clases)}">

                    <option value="">Selecciona una clase</option>

                    <option th:each="c : ${clases}"
                            th:value="${c.id}"
                            th:text="${c.nombreClase}"
                            th:selected="${c.id == idClase}">
                    </option>
                </select>
            </div>
        </div>

        <p class="text-muted mt-3 mb-0"
           th:if="${idEntrenador != null and #lists.isEmpty(clases)}">
            Este entrenador no tiene clases asignadas.
        </p>

        <a th:href="@{/consultas/entrenador-clase}"
           class="btn btn-outline-secondary mt-3">
            Limpiar
        </a>
    </form>
</section>

<!-- Resultado de la consulta mediante DTO -->
<section class="container my-5" th:if="${detalle != null}">
    <h2 class="text-center mb-4">Detalle de la clase</h2>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Entrenador</th>
                    <th>Clase</th>
                    <th>Día</th>
                    <th>Inicio</th>
                    <th>Fin</th>
                    <th>Cupo máximo</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="d : ${detalle}">
                    <td th:text="${d.idClase}"></td>
                    <td th:text="${d.entrenador}"></td>
                    <td th:text="${d.nombreClase}"></td>
                    <td th:text="${d.diaSemana}"></td>
                    <td th:text="${d.horaInicio}"></td>
                    <td th:text="${d.horaFin}"></td>
                    <td th:text="${d.cupoMaximo}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(detalle)}">
                    <td colspan="7" class="text-center text-muted">
                        No se encontró una clase para esta selección.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>

<footer th:replace="~{fragmentos/diseno :: pie}"></footer>

</body>
</html>

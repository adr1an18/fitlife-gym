<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/diseno :: cabecera('Planes')}"></head>
<body>

<nav th:replace="~{fragmentos/diseno :: menu}"></nav>

<section class="container my-5">
    <h1 class="fw-bold text-center">Gestión de planes</h1>
    <p class="lead text-center">Agrega, edita o elimina los planes del gimnasio.</p>
</section>

<!-- Formulario: agregar o editar -->
<section class="container my-5">
    <h2 class="text-center mb-4" th:text="${plan.id == 0} ? 'Agregar plan' : 'Editar plan'">Agregar plan</h2>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/planes/guardar}" th:object="${plan}" method="post" class="border rounded p-4">
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Descripción</label>
                <input type="text" th:field="*{descripcion}" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Precio (S/)</label>
                <input type="number" step="0.01" min="0" name="precio"
                       th:value="${plan.id == 0} ? '' : ${plan.precio}" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Duración (meses)</label>
                <input type="number" min="1" name="duracionMeses"
                       th:value="${plan.id == 0} ? '' : ${plan.duracionMeses}" class="form-control" required>
            </div>
            <div class="col-md-4 d-flex align-items-end gap-2">
                <button type="submit" class="btn btn-danger w-100"
                        th:text="${plan.id == 0} ? 'Agregar' : 'Guardar cambios'">Agregar</button>
                <a th:if="${plan.id != 0}" th:href="@{/planes}" class="btn btn-outline-dark">Cancelar</a>
            </div>
        </div>
    </form>
</section>

<!-- Listado de planes -->
<section class="container my-5">
    <h2 class="text-center mb-4">Planes registrados</h2>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Duración</th><th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${planes}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.descripcion}"></td>
                    <td th:text="'S/ ' + ${p.precio}"></td>
                    <td th:text="${p.duracionMeses} + ' mes(es)'"></td>
                    <td>
                        <a th:href="@{/planes/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-warning">Editar</a>
                        <a th:href="@{/planes/eliminar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Eliminar este plan?')">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(planes)}">
                    <td colspan="6" class="text-center text-muted">No hay planes registrados.</td>
                </tr>
            </tbody>
        </table>
    </div>
</section>

<footer th:replace="~{fragmentos/diseno :: pie}"></footer>

</body>
</html>

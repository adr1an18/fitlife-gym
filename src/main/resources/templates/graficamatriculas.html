<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/diseno :: cabecera('Gráfica de matrículas')}"></head>
<body>

<nav th:replace="~{fragmentos/diseno :: menu}"></nav>

<section class="container my-5">
    <h1 class="text-center fw-bold mb-5">Gráficas de matrículas</h1>
    <div class="row g-4">
        <div class="col-md-6">
            <h5 class="text-center">Matrículas por plan</h5>
            <canvas id="graficoCircular"></canvas>
        </div>
        <div class="col-md-6">
            <h5 class="text-center">Matrículas por mes de inicio</h5>
            <canvas id="graficoMeses"></canvas>
        </div>
    </div>
</section>

<footer th:replace="~{fragmentos/diseno :: pie}"></footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    Chart.defaults.color = '#eaeaea';
    Chart.defaults.borderColor = '#333';

    const nombresPlanes = /*[[${nombresPlanes}]]*/ [];
    const cantidadPorPlan = /*[[${cantidadPorPlan}]]*/ [];
    const meses = /*[[${meses}]]*/ [];
    const cantidadPorMes = /*[[${cantidadPorMes}]]*/ [];

    new Chart(document.getElementById('graficoCircular'), {
        type: 'pie',
        data: {
            labels: nombresPlanes,
            datasets: [{
                data: cantidadPorPlan,
                backgroundColor: ['#c1121f', '#d4af37', '#6c757d', '#8b0000', '#f4d35e', '#343a40', '#e5383b', '#b08d57'],
                borderColor: '#0a0a0a'
            }]
        }
    });

    new Chart(document.getElementById('graficoMeses'), {
        type: 'bar',
        data: {
            labels: meses,
            datasets: [{ label: 'Matrículas', data: cantidadPorMes, backgroundColor: '#c1121f' }]
        },
        options: { scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/diseno :: cabecera('Gráfica de matrículas')}"></head>
<body>

<nav th:replace="~{fragmentos/diseno :: menu}"></nav>

<section class="container my-5">
    <h1 class="text-center fw-bold mb-5">Gráficas de matrículas</h1>
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card p-3 h-100">
                <h5 class="text-center mb-3">Matrículas por plan</h5>
                <div style="position: relative; height: 380px;">
                    <canvas id="graficoCircular"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-3 h-100">
                <h5 class="text-center mb-3">Matrículas por mes de inicio</h5>
                <div style="position: relative; height: 380px;">
                    <canvas id="graficoMeses"></canvas>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragmentos/diseno :: pie}"></footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    Chart.defaults.color = '#eaeaea';
    Chart.defaults.borderColor = '#333';
    Chart.defaults.font.family = 'Poppins, sans-serif';
    Chart.defaults.font.size = 13;

    const nombresPlanes = /*[[${nombresPlanes}]]*/ [];
    const cantidadPorPlan = /*[[${cantidadPorPlan}]]*/ [];
    const meses = /*[[${meses}]]*/ [];
    const cantidadPorMes = /*[[${cantidadPorMes}]]*/ [];

    new Chart(document.getElementById('graficoCircular'), {
        type: 'pie',
        data: {
            labels: nombresPlanes,
            datasets: [{
                data: cantidadPorPlan,
                backgroundColor: ['#c1121f', '#d4af37', '#8b0000', '#f4d35e',
                                  '#e5383b', '#b08d57', '#ff6b6b', '#7a5c00'],
                borderColor: '#0a0a0a',
                borderWidth: 2
            }]
        },
        options: {
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 14, padding: 14 } } }
        }
    });

    new Chart(document.getElementById('graficoMeses'), {
        type: 'bar',
        data: {
            labels: meses,
            datasets: [{
                label: 'Matrículas',
                data: cantidadPorMes,
                backgroundColor: '#c1121f',
                borderColor: '#d4af37',
                borderWidth: 1,
                borderRadius: 6
            }]
        },
        options: {
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, grace: '15%', ticks: { precision: 0 } } },
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 14, padding: 14 } } }
        }
    });
</script>

</body>
</html>
